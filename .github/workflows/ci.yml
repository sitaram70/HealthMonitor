name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed so opencv-python can import cv2 on Ubuntu runners
      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke tests (imports + vitals simulate + Streamlit syntax)
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import importlib, py_compile, sys
          # Import backend modules (should succeed)
          for m in ["src.api", "src.inference", "src.simulate_vitals"]:
              importlib.import_module(m)
              print(f"✅ imported {m}")

          # Quick vitals generation sanity check
          from src.simulate_vitals import simulate
          df = simulate(minutes=1, seed=1, anomaly_prob=0.1)
          assert not df.empty
          required = {"timestamp","heart_rate_bpm","temp_c","risk_event"}
          assert required.issubset(df.columns)
          print("✅ vitals simulate OK")

          # Do NOT import the Streamlit app (it executes UI code on import)
          # Instead, ensure it is syntactically valid
          py_compile.compile("streamlit_app/app.py", doraise=True)
          print("✅ streamlit_app/app.py syntax OK")
          PY
